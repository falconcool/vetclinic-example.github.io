<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена</title>
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="images/logo-paw.svg" type="image/svg+xml">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: #222222;
      background-color: #F6F3EC;
      line-height: 1.6;
    }

    header {
      background-color: #ffffff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #2B3F35;
      text-decoration: none;
    }

    .error-box {
      max-width: 500px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    .error-box .code {
      font-size: 60px;
      color: #D98E3B;
      margin: 0;
    }

    .error-box h1 {
      color: #2B3F35;
      font-size: 22px;
    }

    .btn {
      display: inline-block;
      background-color: #D98E3B;
      color: #1C231E;
      padding: 14px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #595959;
      font-size: 14px;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">Верный друг</a>
  </header>

  <main>
    <div class="error-box">
      <p class="code">404</p>
      <h1>Такой страницы не существует</h1>
      <p>Возможно, ссылка устарела или в адресе опечатка.</p>
      <a href="index.html" class="btn">Вернуться на главную</a>
    </div>
  </main>

  <footer>
    <p>© 2026 Ветклиника «Верный друг»</p>
  </footer>

</body>
</html>
