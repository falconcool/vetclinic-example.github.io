<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты и запись к ветеринару — «Верный друг», Москва</title>
  <meta name="description" content="Адрес, телефон и часы работы ветклиники «Верный друг» в Москве.">
  <!-- canonical — "главный" адрес этой страницы для поисковиков -->
  <link rel="canonical" href="https://vet-friend.example/kontakty.html">

  <link rel="icon" href="images/logo-paw.svg" type="image/svg+xml">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      color: #222222;
      background-color: #F6F3EC;
      line-height: 1.6;
    }

    header {
      background-color: #ffffff;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #2B3F35;
      text-decoration: none;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #222222;
      font-size: 15px;
    }

    nav a:hover {
      color: #8A5000;
    }

    nav a.current {
      color: #8A5000;
      font-weight: bold;
    }

    section {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    section > h1 {
      color: #2B3F35;
      font-size: 28px;
      margin-bottom: 10px;
    }

    section > p.intro {
      color: #555555;
      margin-bottom: 30px;
    }

    .info-block {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .info-block p {
      margin: 8px 0;
    }

    .info-block strong {
      color: #2B3F35;
    }

    /* 
      Форма без JavaScript: используем обычный HTML-тег <form>
      с атрибутом action="mailto:..." — при отправке браузер откроет
      почтовый клиент пользователя с уже заполненным письмом.
      Это самый простой способ сделать "форму" без сервера и кода.
    */
    form {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 24px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #2B3F35;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    label:first-of-type {
      margin-top: 0;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box; /* padding не увеличивает итоговую ширину поля */
    }

    button {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background-color: #D98E3B;
      color: #1C231E;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #E3A04F;
    }

    .breadcrumbs {
      max-width: 600px;
      margin: 16px auto 0;
      padding: 0 24px;
      color: #666666;
      font-size: 14px;
    }

    .breadcrumbs a {
      color: #666666;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #595959;
      font-size: 14px;
      border-top: 1px solid #ddd;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">Верный друг</a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="uslugi.html">Услуги</a>
      <a href="vrachi.html">Врачи</a>
      <a href="tseny.html">Цены</a>
      <a href="blog-privivki.html">Блог</a>
      <a href="kontakty.html" class="current">Контакты</a>
    </nav>
  </header>

  <main>
    <p class="breadcrumbs">
      <a href="index.html">Главная</a> / Контакты
    </p>

    <section>
      <h1>Контакты и запись на приём</h1>
      <p class="intro">Позвоните или оставьте заявку — перезвоним в течение 15 минут.</p>

      <div class="info-block">
        <p><strong>Адрес:</strong> Москва, ул. Садовая, д. 12</p>
        <p><strong>Телефон:</strong> <a href="tel:+74950000000">+7 (495) 000-00-00</a></p>
        <p><strong>Часы работы:</strong> ежедневно, 9:00–21:00</p>
      </div>

      <form action="mailto:info@vet-friend.example" method="post" enctype="text/plain">
        <label for="name">Ваше имя</label>
        <input type="text" id="name" name="Имя" required>

        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="Телефон" required>

        <label for="pet">Питомец</label>
        <select id="pet" name="Питомец">
          <option>Кошка</option>
          <option>Собака</option>
          <option>Другое</option>
        </select>

        <button type="submit">Отправить заявку</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 Ветклиника «Верный друг»</p>
  </footer>

</body>
</html>
